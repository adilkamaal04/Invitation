<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Scratch Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1b2838, #0b1118);
      font-family: 'Cinzel', serif, system-ui;
      padding: 20px;
    }

    .scratch-container {
      position: relative;
      width: 320px;
      height: 200px;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(212, 175, 55, 0.2);
      overflow: hidden;
      border: 2px solid #d4af37;
      user-select: none;
      -webkit-user-select: none;
    }

    .secret-content {
      width: 100%;
      height: 100%;
      background: #0d1b2a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      color: #fff;
    }

    .secret-content .tag {
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #d4af37;
      margin-bottom: 6px;
    }

    .secret-content .date {
      font-size: 1.6rem;
      font-weight: 700;
      color: #f7e7ce;
      letter-spacing: 1px;
    }

    .secret-content .time {
      font-size: 0.95rem;
      color: #c0c0c0;
      margin-top: 4px;
    }

    .secret-content .venue {
      font-size: 0.8rem;
      color: #a0aab2;
      margin-top: 8px;
    }

    #scratch-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }
  </style>
</head>
<body>

  <div class="scratch-container">
    <div class="secret-content">
      <div class="tag">You're Invited</div>
      <div class="date">DECEMBER 18, 2026</div>
      <div class="time">Friday • 7:00 PM Onwards</div>
      <div class="venue">The Grand Palace • New Delhi</div>
    </div>
    <canvas id="scratch-canvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('scratch-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.querySelector('.scratch-container');

    let isDrawing = false;
    let isRevealed = false;

    function initCanvas() {
      const rect = container.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;

      const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      grad.addColorStop(0, '#BF953F');
      grad.addColorStop(0.25, '#FCF6BA');
      grad.addColorStop(0.5, '#B38728');
      grad.addColorStop(0.75, '#FBF5B7');
      grad.addColorStop(1, '#AA771C');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 2;
      ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

      ctx.fillStyle = '#3a2e0a';
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('✨ SCRATCH TO REVEAL DATE ✨', canvas.width / 2, canvas.height / 2 + 5);
    }

    initCanvas();

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function scratch(e) {
      if (!isDrawing || isRevealed) return;
      const { x, y } = getCoords(e);
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(x, y, 22, 0, Math.PI * 2);
      ctx.fill();
      checkProgress();
    }

    function checkProgress() {
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const pixels = imageData.data;
      let transparentPixels = 0;

      for (let i = 3; i < pixels.length; i += 16) {
        if (pixels[i] === 0) transparentPixels++;
      }

      const totalSampled = pixels.length / 16;
      if (transparentPixels / totalSampled > 0.45) {
        isRevealed = true;
        canvas.style.transition = 'opacity 0.6s ease';
        canvas.style.opacity = '0';
        setTimeout(() => {
          canvas.style.display = 'none';
        }, 600);
      }
    }

    canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
    canvas.addEventListener('mousemove', scratch);
    window.addEventListener('mouseup', () => { isDrawing = false; });

    canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });
    canvas.addEventListener('touchmove', scratch);
    window.addEventListener('touchend', () => { isDrawing = false; });
  </script>
</body>
  </html>
