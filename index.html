rel="stylesheet">


<style>

/* =====================================================
   COLOUR SYSTEM
   ===================================================== */

:root{

    --pink:#f6e1e6;
    --pink-light:#fff8f9;
    --pink-soft:#efd1d9;

    --rose:#b94764;
    --rose-dark:#852b46;
    --rose-light:#d88499;

    --gold:#b78a4d;
    --gold-light:#d9b979;

    --cream:#fffaf7;

    --text:#5c3b45;
    --muted:#91717a;

}


/* =====================================================
   RESET
   ===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    background:#ead0d7;

    color:var(--text);

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    overflow-x:hidden;
}

button{
    font:inherit;
    cursor:pointer;
}


/* =====================================================
   FIRST SCREEN
   REALISTIC ENVELOPE REFERENCE
   ===================================================== */

.opening{

    position:fixed;

    inset:0;

    z-index:9999;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    overflow:hidden;

    background:

        /* satin highlight */

        radial-gradient(
            ellipse at 50% 20%,
            rgba(255,255,255,.38),
            transparent 35%
        ),

        /* satin folds */

        linear-gradient(
            115deg,
            #9f8a73 0%,
            #d9c4a8 25%,
            #a8937b 43%,
            #dfccb2 61%,
            #a58e74 82%,
            #cbb59a 100%
        );

    transition:
        opacity 1.1s ease,
        visibility 1.1s ease;
}


/* Satin folds */

.opening::before{

    content:"";

    position:absolute;

    inset:-20%;

    background:

        linear-gradient(
            135deg,
            transparent 22%,
            rgba(255,255,255,.25) 30%,
            transparent 41%
        ),

        linear-gradient(
            35deg,
            transparent 37%,
            rgba(63,43,31,.18) 46%,
            transparent 57%
        ),

        linear-gradient(
            140deg,
            transparent 60%,
            rgba(255,255,255,.18) 69%,
            transparent 80%
        );

    filter:blur(14px);

    transform:rotate(-4deg);

    pointer-events:none;
}


/* =====================================================
   REALISTIC ENVELOPE
   ===================================================== */

.envelope{

    position:relative;

    width:min(88vw,410px);

    aspect-ratio:1.43;

    background:

        /* subtle paper grain */

        radial-gradient(
            circle at 15% 20%,
            rgba(255,255,255,.5) 0 1px,
            transparent 1.7px
        ),

        radial-gradient(
            circle at 65% 65%,
            rgba(100,70,45,.08) 0 1px,
            transparent 1.5px
        ),

        linear-gradient(
            145deg,
            #e7d4bb,
            #f0e0ca 45%,
            #d7c0a2
        );

    background-size:
        8px 8px,
        13px 13px,
        100% 100%;

    border:1px solid rgba(105,76,43,.65);

    box-shadow:

        0 35px 65px rgba(50,34,23,.38),

        0 8px 15px rgba(58,38,25,.22),

        inset 0 0 0 1px rgba(255,255,255,.45);

    transform:rotate(-1deg);

    transition:
        transform .8s ease,
        opacity .8s ease;
}


/* Envelope inner border */

.envelope::before{

    content:"";

    position:absolute;

    inset:10px;

    border:1px solid rgba(126,91,51,.42);

    pointer-events:none;

    z-index:20;
}


/* =====================================================
   ENVELOPE FOLDS
   ===================================================== */

.envelope-left{

    position:absolute;

    left:0;
    bottom:0;

    width:50%;
    height:70%;

    background:
        linear-gradient(
            145deg,
            transparent 0 48%,
            rgba(120,85,52,.17) 49%,
            transparent 50%
        );

    clip-path:polygon(
        0 0,
        100% 100%,
        0 100%
    );

    opacity:.65;
}


.envelope-right{

    position:absolute;

    right:0;
    bottom:0;

    width:50%;
    height:70%;

    background:
        linear-gradient(
            215deg,
            transparent 0 48%,
            rgba(120,85,52,.15) 49%,
            transparent 50%
        );

    clip-path:polygon(
        100% 0,
        100% 100%,
        0 100%
    );

    opacity:.65;
}


/* =====================================================
   TOP FLAP
   ===================================================== */

.envelope-flap{

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:57%;

    background:
        linear-gradient(
            155deg,
            #e6d1b6,
            #f1e0ca 52%,
            #d4bc9e
        );

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    z-index:5;

    filter:
        drop-shadow(
            0 5px 5px
            rgba(70,45,28,.12)
        );

    transition:
        transform 1.35s
        cubic-bezier(.6,.05,.2,1);

    transform-origin:
        top center;
}


/* opening animation */

.envelope.open .envelope-flap{

    transform:
        rotateX(180deg);

}


/* =====================================================
   ENVELOPE STRING
   ===================================================== */

.string{

    position:absolute;

    width:100%;
    height:100%;

    inset:0;

    z-index:6;

    pointer-events:none;
}


.string::before{

    content:"";

    position:absolute;

    width:130%;

    height:1px;

    background:
        rgba(82,55,34,.68);

    top:51%;

    left:-15%;

    transform:
        rotate(31deg);
}


.string::after{

    content:"";

    position:absolute;

    width:130%;

    height:1px;

    background:
        rgba(82,55,34,.55);

    top:49%;

    left:-15%;

    transform:
        rotate(-31deg);
}


/* =====================================================
   WAX SEAL
   ===================================================== */

.wax-seal{

    position:absolute;

    z-index:15;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:78px;
    height:78px;

    border-radius:50%;

    background:

        radial-gradient(
            circle at 35% 30%,
            #d4a868,
            #9c6b32 60%,
            #70491e 100%
        );

    border:
        2px solid #76501f;

    box-shadow:

        0 8px 15px rgba(56,34,17,.32),

        inset
        0 0 0 4px
        rgba(255,215,145,.18);

    display:flex;

    align-items:center;

    justify-content:center;

    color:#fff0d1;

    font-family:
        "Great Vibes",
        cursive;

    font-size:29px;

    line-height:.8;

    text-align:center;

    transition:
        transform .5s ease,
        opacity .5s ease;
}


.wax-seal small{

    display:block;

    font-family:
        "Cinzel",
        serif;

    font-size:6px;

    letter-spacing:.08em;

    margin-top:4px;
}


.envelope.open .wax-seal{

    transform:
        translate(-50%,-50%)
        scale(.5);

    opacity:0;
}


/* =====================================================
   SMALL FLOWERS ON ENVELOPE
   ===================================================== */

.flower{

    position:absolute;

    z-index:3;

    color:#fff7f4;

    opacity:.72;

    font-size:22px;
}


.flower.one{
    top:16px;
    right:23px;
}


.flower.two{
    bottom:18px;
    left:24px;
}


.flower.three{
    top:34px;
    left:23px;
    font-size:16px;
}


/* =====================================================
   FIRST SCREEN TEXT
   ===================================================== */

.envelope-label{

    position:absolute;

    left:0;
    right:0;

    bottom:23px;

    text-align:center;

    z-index:12;

    font-family:
        "Cinzel",
        serif;

    font-size:8px;

    letter-spacing:.26em;

    color:#73583c;

    text-transform:uppercase;
}


.tap-text{

    position:absolute;

    left:0;
    right:0;

    bottom:-53px;

    text-align:center;

    color:#fff6ed;

    font-family:
        "Manrope",
        sans-serif;

    font-size:9px;

    letter-spacing:.22em;

    text-transform:uppercase;
}


/* =====================================================
   MAIN PAGE
   ===================================================== */

.page{

    width:min(100%,520px);

    margin:auto;

    background:var(--pink);

    min-height:100vh;

    box-shadow:
        0 0 60px
        rgba(80,35,48,.12);
}


/* music */

.music{

    position:fixed;

    right:15px;
    top:15px;

    z-index:100;

    width:42px;
    height:42px;

    border:1px solid
        rgba(255,255,255,.7);

    border-radius:50%;

    background:
        rgba(126,38,62,.92);

    color:white;

    font-size:17px;

    box-shadow:
        0 7px 18px
        rgba(65,20,32,.25);
}


/* =====================================================
   HERO
   ===================================================== */

.hero{

    position:relative;

    min-height:100svh;

    display:flex;

    align-items:flex-end;

    justify-content:center;

    text-align:center;

    padding:
        70px 28px 90px;

    color:white;

    overflow:hidden;

    background:

        linear-gradient(
            to bottom,
            rgba(60,20,35,.03),
            rgba(60,20,35,.78)
        ),

        url(
            "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&q=88"
        )
        center/cover no-repeat;
}


.hero-content{

    position:relative;

    z-index:2;
}


.hero .small{

    color:#f9e6ea;

    font-family:
        "Cinzel",
        serif;

    font-size:8px;

    letter-spacing:.27em;

}


.hero h1{

    margin:15px 0 0;

    font-family:
        "Great Vibes",
        cursive;

    font-weight:400;

    font-size:72px;

    line-height:.78;

    text-shadow:
        0 4px 20px

}


.hero .amp{

    display:block;

    font-size:40px;

    margin:10px 0;
}


.hero p{

    margin:
        25px auto 0;

    max-width:340px;

    font-size:19px;

    line-height:1.45;

    color:#fff3f5;
}


.gold-line{

    width:105px;

    height:1px;

    margin:20px auto;

    background:
        linear-gradient(
            90deg,
            transparent,
            #e2bd7a,
            transparent
        );
}


/* =====================================================
   COMMON SECTION
   ===================================================== */

.section{

    position:relative;

    min-height:100svh;

    padding:
        90px 27px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    overflow:hidden;
}


.short{

    min-height:auto;

    padding:
        90px 27px;
}


/* pink luxury background */

.pink-bg{

    background:

        radial-gradient(
            circle at 15% 15%,
            rgba(255,255,255,.72),
            transparent 30%
        ),

        radial-gradient(
            circle at 85% 80%,
            rgba(185,72,99,.10),
            transparent 32%
        ),

        linear-gradient(
            145deg,
            #f8e9ec,
            #f1d5dd
        );
}


/* subtle paper dots */

.pink-bg::before{

    content:"";

    position:absolute;

    inset:0;

    opacity:.12;

    background-image:
        radial-gradient(
            circle,
            #9d4057 1px,
            transparent 1.4px
        );

    background-size:
        27px 27px;

    pointer-events:none;
}


.tiny{

    font-family:
        "Cinzel",
        serif;

    font-size:8px;

    letter-spacing:.28em;

    text-transform:uppercase;

    color:#956c75;
}


.script{

    font-family:
        "Great Vibes",

    font-weight:400;

    color:var(--rose-dark);
}


h2{

    margin:
        12px 0;

    font-size:53px;

    font-weight:400;

    line-height:.95;
}


p{

    max-width:375px;

    margin:
        15px auto;

    font-size:21px;

    line-height:1.48;
}


.divider{

    width:105px;

    height:1px;

    margin:18px auto;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--gold),
            transparent
        );
}


/* =====================================================
   MESSAGE
   ===================================================== */

.message{

    background:
        linear-gradient(
            180deg,
            #f5dfe4,
            #faedef
        );
}


.message .big{

    font-family:
        "Great Vibes",

    color:
        var(--rose-dark);

    line-height:.94;
}

/* =====================================================
   PROGRAMME
   ===================================================== */

.programme{

    background:
        linear-gradient(
            180deg,
            #f8e9ec,
            #efd3dc
        );
}


.programme-card{

    width:100%;

    max-width:420px;

    padding:
        38px 22px;

    background:
        rgba(255,250,250,.52);

    border:

        rgba(183,138,77,.55);

        0 20px 50px

    position:relative;
}


.programme-card::before{

    content:"";

    position:absolute;

    inset:8px;

    border:
        1px solid
        rgba(183,138,77,.22);

    pointer-events:none;
}


.programme-title{

    font-family:
        "Great Vibes",
        cursive;

    font-size:52px;

.programme-date{

    margin:
        10px 0 25px;

    font-family:
        "Cinzel",

    font-size:9px;

    letter-spacing:.12em;

    color:#88683d;
}


.event{

    display:grid;

    grid-template-columns:
        88px 1fr;

    gap:12px;

    padding:
        15px 0;

    border-bottom:
        1px solid
        rgba(183,138,77,.25);

    text-align:left;
}


.event:last-child{

    border-bottom:0;
}


.event-time{

    font-family:
        "Cinzel",
        serif;

    font-size:8px;

    line-height:1.5;

    letter-spacing:.08em;

    text-transform:uppercase;

    color:#95683d;
}


.event-name{

    color:#762d44;

    font-size:25px;

    line-height:1;
}


.event-detail{

    margin-top:5px;

    font-size:16px;

    color:#8d6f77;

    line-height:1.3;
}


.venue-mini{

    padding-top:20px;

    border-top:

}


.venue-mini strong{

    display:block;

    color:#702b41;

    font-size:23px;

    font-weight:500;
}


.venue-mini span{

    font-size:16px;

    color:#8e7078;
}


/* =====================================================
   SCRATCH DATE
   ===================================================== */

.scratch{

    background:
        linear-gradient(
            180deg,
            #f1d6de,
            #f9e9ec
        );
}


.scratch-box{

    position:relative;

    width:
        min(88vw,360px);

    height:360px;

    margin-top:20px;
}


.heart-date{

    position:absolute;

    inset:25px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    background:
        #fff9f7;

    color:
        var(--rose-dark);

    clip-path:
        path(
            "M160 290
             C140 270 38 215 38 112
             C38 43 122 32 160 87
             C198 32 282 43 282 112
             C282 215 180 270 160 290 Z"
        );
}


.heart-date .date{

    font-size:29px;
}


.heart-date small{

}


#scratchCanvas{

    position:absolute;

    height:100%;

    cursor:crosshair;
}

   COUNTDOWN

.count{

}


.count:last-child{

}


.count b{

    display:block;

    color:

    font-size:30px;

    font-weight:400;
}


.count span{

    display:block;

    margin-top:5px;

    font-family:
        "Cinzel",
        serif;

    font-size:7px;

    color:#927078;

    text-transform:uppercase;
}


/* =====================================================
   VENUE
   ===================================================== */

.venue{

    background:#fbf0f2;
}


.venue-card{

    width:100%;

        38px 20px;

    border:

        #dfbdc7;

    background:
        rgba(255,255,255,.43);
}


.venue-icon{

    color:
        var(--gold);

    font-size:25px;
}


.venue-card h3{

}


.venue-card p{

    color:

    font-size:17px;
}


.map-button{

    margin-top:15px;

    padding:
        12px 22px;

    color:white;

    background:
        #922e4a;

    text-decoration:none;

    font-family:
        "Cinzel",
        serif;

    font-size:8px;

    letter-spacing:.12em;
}


/* =====================================================
   FINAL MESSAGE
   ===================================================== */

.final{

    background:
        linear-gradient(
            180deg,
            #f0d5dd,
            #e7c2ce
        );

    min-height:auto;
}


.final-name{

    margin:
        15px 0;

    font-family:
        "Great Vibes",
        cursive;

    font-size:57px;

    color:
        #822a44;
}

    font-style:italic;

    color:#72515b;
}

   RESPONSIVE
   ===================================================== */

    .envelope{

        width:90vw;
    }

    .wax-seal{

        width:70px;
        height:70px;

        font-size:26px;
    }

    .hero h1{

        font-size:62px;
    }

    h2{

        font-size:47px;
    }

    .programme-title{

        font-size:47px;
    }

}


/* =====================================================
   DESKTOP
   ===================================================== */

@media(min-width:700px){

    .page{

        box-shadow:
            0 0 70px
            rgba(60,30,40,.18);
    }

}
